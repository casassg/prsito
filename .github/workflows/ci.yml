name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev
      - uses: cashapp/activate-hermit@v1
      - uses: actions/cache@v4
        with:
          path: |
            .hermit/rust
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.version.outputs.next }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cashapp/activate-hermit@v1
      - id: version
        run: |
          next=$(svu next)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          [ "$next" != "$(svu current)" ] && echo "bump=true" >> "$GITHUB_OUTPUT" || true

  build:
    needs: version
    if: needs.version.outputs.bump
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: prsito.dmg
          - os: ubuntu-latest
            asset: prsito-linux-x86_64.tar.gz
          - os: windows-latest
            asset: prsito-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      NEXT: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev
      - if: runner.os != 'Windows'
        uses: cashapp/activate-hermit@v1
      - uses: actions/cache@v4
        with:
          path: |
            .hermit/rust
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - if: runner.os == 'macOS'
        run: |
          cargo clippy --all-targets -- -D warnings
          scripts/release.sh "${NEXT#v}"
      - if: runner.os != 'macOS'
        shell: bash
        run: |
          export PRSITO_VERSION="${NEXT#v}"
          cargo build --release
          cd target/release
          if [ "$RUNNER_OS" = Windows ]; then 7z a "../${{ matrix.asset }}" prsito.exe; else tar -czf "../${{ matrix.asset }}" prsito; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.asset }}

  publish:
    needs: [test, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEXT: ${{ needs.version.outputs.next }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          git tag "$NEXT" "$GITHUB_SHA"
          git push origin "refs/tags/$NEXT"
          gh release create "$NEXT" dist/* --generate-notes
