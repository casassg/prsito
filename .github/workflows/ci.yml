name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev
      - uses: cashapp/activate-hermit@v1
      - uses: actions/cache@v4
        with:
          path: |
            .hermit/rust
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      next: ${{ steps.version.outputs.next }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cashapp/activate-hermit@v1
      - id: version
        run: |
          next=$(svu next)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          [ "$next" != "$(svu current)" ] && echo "bump=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.version.outputs.bump
        uses: actions/cache@v4
        with:
          path: |
            .hermit/rust
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - if: steps.version.outputs.bump
        run: cargo clippy --all-targets -- -D warnings
      - if: steps.version.outputs.bump
        run: scripts/release.sh "${NEXT#v}"
        env:
          NEXT: ${{ steps.version.outputs.next }}
      - if: steps.version.outputs.bump
        run: |
          git tag "$NEXT" "$GITHUB_SHA"
          git push origin "refs/tags/$NEXT"
          gh release create "$NEXT" target/prsito.dmg --generate-notes
        env:
          NEXT: ${{ steps.version.outputs.next }}
          GH_TOKEN: ${{ github.token }}

  binaries:
    needs: release
    if: needs.release.outputs.bump
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: prsito-linux-x86_64.tar.gz
          - os: windows-latest
            asset: prsito-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      NEXT: ${{ needs.release.outputs.next }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev
      - if: runner.os == 'Linux'
        uses: cashapp/activate-hermit@v1
      - uses: actions/cache@v4
        with:
          path: |
            .hermit/rust
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - shell: bash
        run: |
          export PRSITO_VERSION="${NEXT#v}"
          cargo build --release
          cd target/release
          if [ "$RUNNER_OS" = Windows ]; then 7z a "../${{ matrix.asset }}" prsito.exe; else tar -czf "../${{ matrix.asset }}" prsito; fi
      - shell: bash
        run: gh release upload "$NEXT" "target/${{ matrix.asset }}"
